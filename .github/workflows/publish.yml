name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test/smoke.ts
      - run: bun test/enforce.ts
      - run: bun test/adapters.ts
      - run: bun test/cli.ts
      - run: bun test/language-gaps.ts
      - run: bun test/guards.ts
      - run: bun test/messages.ts
      - run: bun test/property.ts
      - run: bun test/fuzz.ts
      - run: bun test/install.ts
      - run: bun test/v2-host.ts
      - run: bun test/cline-plugin.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      - name: Check whether this exact version is already published
        id: ver
        run: |
          local_version="$(node -p "require('./package.json').version")"
          if npm view "dejavu-gates@${local_version}" version >/dev/null 2>&1; then
            echo "version already in registry, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm via OIDC
        if: steps.ver.outputs.skip == 'false'
        run: npx --yes npm@^11.5.1 publish --provenance
      - name: GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            awk -v h="## ${GITHUB_REF_NAME#v} " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  github-packages:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          registry-url: https://npm.pkg.github.com
      - name: Check whether this exact version is already mirrored
        id: mirror
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          local_version="$(node -p "require('./package.json').version")"
          if npm view "@whitebite/dejavu-gates@${local_version}" version >/dev/null 2>&1; then
            echo "version already mirrored, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish scoped mirror to GitHub Packages
        if: steps.mirror.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.name = "@whitebite/dejavu-gates"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          npm publish
