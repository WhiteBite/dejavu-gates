name: publish-legacy-stub

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > .npmrc
          npm publish ./legacy/opencode-dejavu
          npm deprecate opencode-dejavu "renamed to dejavu-gates - https://www.npmjs.com/package/dejavu-gates - update your opencode.json plugin entry to dejavu-gates"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
