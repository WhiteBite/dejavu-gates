name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test/smoke.ts
      - run: bun test/enforce.ts
      - run: bun test/adapters.ts
      - run: bun test/cli.ts
      - run: bun test/language-gaps.ts
      - run: bun test/guards.ts
      - run: bun test/messages.ts
      - run: bun test/property.ts
      - run: bun test/fuzz.ts
      - run: bun test/install.ts
      - run: bun test/v2-host.ts
      - run: bun test/cline-plugin.ts
      - run: bun test/cline-plugin.ts
      - run: bun test/recurrence.ts
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45
      - name: AST gates (no-load-force-flag)
        run: ast-grep scan
