name: rdk-audit

on:
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Fail the run when the Discoverability Score is below this value'
        required: false
        default: '0'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: WhiteBite/repo-aeo/action@38550ff # v0.3.1
        with:
          min_score: ${{ github.event.inputs.min_score || vars.RDK_MIN_SCORE || 0 }}
